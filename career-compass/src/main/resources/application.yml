
spring:

  application:
    name: career-compass
  main:
    log-startup-info: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:career_compass}${DB_SSL_PARAMS:}
    username: ${DB_USERNAME:career_compass}
    password: ${DB_PASSWORD:career_compass_local_pw}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: openai/gpt-oss-20b
          max-tokens: 4096
      embedding:
        # Groq does not currently serve an embeddings endpoint, so the
        # embedding client is disabled here. Module 3 (embedding + matching)
        # will use a local, free embedding model instead (see that module's
        # notes) rather than calling out to a paid embeddings API.
        enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB



server:
  port: ${PORT:8080}

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  brevo:
    api-key: ${BREVO_API_KEY:}
  embedding:
    dimensions: ${EMBEDDING_DIMENSIONS:384}
  mail:
    from: ${MAIL_FROM:noreply@careercompass.dev}
  report:
    match-threshold: ${REPORT_MATCH_THRESHOLD:70}
    developer-name: "Shaik Vajeed"
    github-url: "https://github.com/vajeedShaik/career-compass"
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production}
    expiration-ms: 86400000
springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    org.springframework.beans.factory.support: TRACE
    org.springframework.context.annotation: DEBUG
    com.careercompass: DEBUG